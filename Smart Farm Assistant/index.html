<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Assistant</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/chat.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <span>FarmAssist</span>
            </div>

            <ul class="nav-links">
                <li><a href="#" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#" class="nav-item"><i class="fas fa-robot"></i> Assistant</a></li>
                <li><a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="#" class="nav-item"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Toggle -->
            <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>

            <div class="dashboard-grid">
                <!-- Row 1: Stats -->
                <div class="stats-row">
                    <div class="card stat-card">
                        <div class="stat-icon"><i class="fas fa-temperature-high"></i></div>
                        <div class="stat-info">
                            <h3>Temperature</h3>
                            <div class="stat-value" id="temp-value">24.5°C</div>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="color: #3b82f6; background: rgba(59, 130, 246, 0.1);"><i
                                class="fas fa-tint"></i></div>
                        <div class="stat-info">
                            <h3>Humidity</h3>
                            <div class="stat-value" id="humidity-value">68%</div>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="color: #f59e0b; background: rgba(245, 158, 11, 0.1);"><i
                                class="fas fa-sun"></i></div>
                        <div class="stat-info">
                            <h3>Light</h3>
                            <div class="stat-value" id="light-value">High</div>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Main Chart & Chat/Controls -->
                <div class="content-row">
                    <!-- Left: Chart -->
                    <div class="card chart-card">
                        <div class="card-header">
                            <h2 class="card-title">Environmental Trends</h2>
                        </div>
                        <div class="chart-container">
                            <canvas id="mainChart"></canvas>
                        </div>
                    </div>

                    <!-- Right: Chat & Controls Stack -->
                    <div class="side-stack">
                        <!-- Chatbot -->
                        <div class="card chat-card">
                            <div class="card-header">
                                <h2 class="card-title"><i class="fas fa-robot"
                                        style="margin-right: 8px; color: var(--primary-color);"></i> Assistant</h2>
                                <button class="btn btn-secondary" id="clear-chat"
                                    style="padding: 4px 8px; font-size: 0.75rem;">Clear</button>
                            </div>
                            <div class="chat-container">
                                <div class="chat-messages" id="chat-messages">
                                    <!-- Messages will appear here -->
                                </div>
                                <div class="chat-input-area">
                                    <div class="input-wrapper">
                                        <input type="text" class="chat-input" id="chat-input" placeholder="Ask...">
                                        <button class="send-btn" id="send-btn"><i
                                                class="fas fa-paper-plane"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Controls -->
                        <div class="card controls-card">
                            <div class="card-header">
                                <h2 class="card-title">Controls</h2>
                            </div>
                            <div class="controls-list">
                                <div class="control-item">
                                    <div class="control-info">
                                        <h4>Irrigation</h4>
                                        <p>Zone A</p>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" id="irrigation-toggle">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                <div class="control-item">
                                    <div class="control-info">
                                        <h4>Ventilation</h4>
                                        <p>Fans</p>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" id="ventilation-toggle" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/knowledge.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
